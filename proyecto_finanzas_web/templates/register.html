{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<h1>Crear cuenta</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <label>Usuario<input type="text" name="username" minlength="3" required /></label>
  <label>Contraseña<input type="password" name="password" minlength="8" required /></label>
  <label>Código de invitación<input type="password" name="invite_code" required /></label>
  <button type="submit">Crear</button>
</form>
<p><a href="{{ url_for('login') }}">Volver al login</a></p>
{% endblock %}
